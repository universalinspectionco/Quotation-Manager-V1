<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Desktop Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Inner Ring / Precision Caliper Grid Pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="3" />
  
  <!-- Shield of Quality & Verification -->
  <path d="M256 100 L350 145 C350 250 256 315 256 315 C256 315 162 250 162 145 Z" fill="#ffffff" filter="url(#shadow)" opacity="0.96" />
  
  <!-- Inner Shield Color -->
  <path d="M256 115 L334 152 C334 238 256 295 256 295 C256 295 178 238 178 152 Z" fill="#1e40af" />
  
  <!-- UIC Monogram & Inspection Checkmark -->
  <path d="M225 210 L248 233 L295 180" fill="none" stroke="#60a5fa" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- UIC Letters below Shield -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="4">UNIVERSAL</text>
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#93c5fd" text-anchor="middle" letter-spacing="8">INSPECTION</text>
  <text x="256" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">QUOTATION MANAGER</text>
</svg>
