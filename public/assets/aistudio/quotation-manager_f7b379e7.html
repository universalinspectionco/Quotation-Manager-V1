function padInit(){const c=$("#pad"),x=c.getContext("2d");if(!x)return;x.lineWidth=2.5;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0b1b5c";let d=0;const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{d=1;const[a,b]=p(e);x.beginPath();x.moveTo(a,b);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};c.onpointerup=()=>d=0}

function mk(q){try{const doc=new window.jspdf.jsPDF({unit:"pt",format:"letter"}),W=612,H=792,M=36,CW=W-2*M,TOP=96,BOT=712,done=new Set(),S=D.set,t=tot(q),navy=[20,30,110],red=[200,20,20];
const dim=k=>{const p=doc.getImageProperties(img(k));return p.height/p.width};
const decor=()=>{const n=doc.internal.getCurrentPageInfo().pageNumber;if(done.has(n))return;done.add(n);const G=doc.GState;doc.setGState(new G({opacity:.16}));doc.addImage(img("wm"),fmt(img("wm")),W/2-150,H/2-150*dim("wm"),300,300*dim("wm"));doc.setGState(new G({opacity:1}));

async function xl(id){const q=get(id),t=tot(q),z=await JSZip.loadAsync(XT,{base64:true}),PS="xl/worksheets/sheet1.xml";let x=await z.file(PS).async("string");

blanks=(n,s,from="C")=>["C","D","E","F"].filter(c=>c>=from).map(c=>bl(c+n,s)),mrow=(n,s,v,h)=>{row(n,[st("B"+n,s,v),...blanks(n,s)],h);mg.push(`B${n}:F${n}`)},r2=v=>Math.round(v*100)/100;
const dd=q.date.split("-").map(Number),ser=Math.round(Date.UTC(dd[0],dd[1]-1,dd[2])/864e5+25569);
row(1,[st("A1",26,String(q.title||"QUOTATION").toUpperCase()),...["B","C","D","E","F"].map(c=>bl(c+1,26))]);mg.push("A1:F1");
row(2,[st("B2",10,"Attn To:"),st("C2",2,q.attn||""),st("E2",19,"Ref.:"),st("F2",19,q.ref)]);row(3,[st("B3",24,q.client||""),st("E3",19,"Date :"),nu("F3",23,ser)],15.75);row(4,[st("B4",20,"Location: "+(q.location||""))],15.75);row(5,[],15.75);row(6,[]);
let intro=String(q.intro||"");if(q.delivery)intro+="\nDelivery Terms: "+q.delivery;if(q.service)intro+="\nService Beginning Terms: "+q.service;const il=LN(intro,85),ih=il>4?Math.ceil(il*16/3):0;
row(7,[st("B7",25,intro),...blanks(7,25)],ih);row(8,blanks(8,25,"B"),ih);row(9,blanks(9,25,"B"),ih);mg.push("B7:F9");row(10,["B","C","D","E","F"].map(c=>bl(c+10,3)));
